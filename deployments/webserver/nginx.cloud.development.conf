# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/membership/webserver.pid;
error_log /var/log/sdkwork/membership/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name membership-dev.sdkwork.com membership-dev.birdcoder.com membership-dev.dtupay.com membership-dev.noaper.com membership-dev.sdkwork.cn membership-dev.birdcoder.cn membership-dev.dtupay.cn membership-dev.noaper.cn membership-dev.skubc.com membership-dev.skubc.cn membership-dev.zowalk.com membership-dev.zowalk.cn membership-dev.offer86.com membership-dev.offer86.cn membership-dev.86offer.com membership-dev.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/membership/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
