# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/membership/webserver.pid;
error_log /var/log/sdkwork/membership/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name membership-test.sdkwork.com membership-test.birdcoder.com membership-test.dtupay.com membership-test.sdkwork.cn membership-test.birdcoder.cn membership-test.dtupay.cn membership-test.skubc.com membership-test.skubc.cn membership-test.zowalk.com membership-test.zowalk.cn membership-test.offer86.com membership-test.offer86.cn membership-test.86offer.com membership-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
