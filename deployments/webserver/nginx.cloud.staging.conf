# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/membership/webserver.pid;
error_log /var/log/sdkwork/membership/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name membership-staging.sdkwork.com membership-staging.birdcoder.com membership-staging.dtupay.com membership-staging.sdkwork.cn membership-staging.birdcoder.cn membership-staging.dtupay.cn membership-staging.skubc.com membership-staging.skubc.cn membership-staging.zowalk.com membership-staging.zowalk.cn membership-staging.offer86.com membership-staging.offer86.cn membership-staging.86offer.com membership-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
